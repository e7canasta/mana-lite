El bbox azul está dentro del ROI fijo. Pero el verde sale hasta x=1375, fuera de x=1240, y face-yolo incluso detecta una face fuera del ROI fijo.
La explicación matemática es:
bbox person visible:
x = 1189..1240
ancho = 51 px

face square:
side = max(320, ancho_person)
centro_x = (1189 + 1240) / 2 = 1214
x1 = 1214 - 160 = 1054
x2 = 1214 + 160 = 1374
Por eso ocurre:
- detect-fast sí está limitado al ROI fijo.
- El bbox azul sí está limitado al ROI fijo.
- face-yolo recibe un crop físico real, pero ese crop se construye como un cuadrado de 320x320.
- Ese cuadrado actualmente se limita contra los bordes del frame completo, no contra el ROI fijo padre.
- En consecuencia, cuando la persona toca el borde, face-yolo puede mirar fuera del ROI de detect-fast.
Así que tu razonamiento sobre el bbox azul es correcto. El error estaba en asumir que el ROI verde era el mismo espacio que el bbox azul. No lo es: es un segundo ROI expandido.
No cambié nada en esta revisión. El punto de diseño pendiente queda claramente identificado:
ROI face actual = cuadrado alrededor del bbox
ROI face estricto = cuadrado ∩ ROI detect-fast
El log demuestra que actualmente estamos usando la primera opción.
