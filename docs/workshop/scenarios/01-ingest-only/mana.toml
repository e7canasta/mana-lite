# ============================================================================
# ESCENARIO 01 — INGESTA PURA
#
# Mide una sola cosa: que la cadena RTSP → demux → dedupe de keyframes →
# decode → JSONL sea estable. Todo lo que pueda enmascarar un problema de
# ingesta está apagado.
#
# Correr desde la raíz del repositorio:
#   cargo run --release -- --config workshop/scenarios/01-ingest-only/mana.toml
# ============================================================================

# Archivos de mecanismo del dispositivo, compartidos con producción. No
# expresan política del escenario, así que no se duplican.
metrics_file = "config/metrics.toml"
viz_file = "config/viz.toml"
rerun_file = "config/rerun.toml"

[source]
url = "rtsp://192.168.1.6:8554/home2"
username = "admin"
password = ""
transport = "tcp"
keyframes_only = true

[ingest]
poll_timeout_ms = 50
error_window_size = 128
error_window_threshold = 25
reconnect_backoff_initial_ms = 1000
reconnect_backoff_max_ms = 30000

[inference]
model_catalog = "config/models.toml"
blueprint_file = "workshop/scenarios/01-ingest-only/blueprint/blueprint.toml"
# `zones_file`, `fsm_file` y `depth_rules_file` son Option y se omiten a
# propósito: sin zonas ni FSM no hay catálogo que compilar ni que pueda fallar.

[detection]
face_component_coverage = 0.70
face_max_center_y_ratio = 0.65
face_edge_margin_px = 32
same_class_iou = 0.5

# ----------------------------------------------------------------------------
# Política clínica: inerte en este escenario.
# `presence.enabled = false` evita que el filtro de presencia produzca estados
# a partir de un pipeline que no está detectando nada.
# ----------------------------------------------------------------------------
[presence]
enabled = false
class = "person"

[presence.poi]
on_ms = 200
off_ms = 16_000

[presence.occupancy]
single_confirm_ms = 3000
empty_confirm_ms = 8000
multiple_confirm_ms = 5000
multiple_exit_ms = 5000
require_confirmed_tracks = false

[tracking]
max_age_ms = 40_000
tentative_max_age_ms = 6_000
ghost_max_ms = 6_000
min_hits = 2
iou_threshold = 0.2
nominal_dt_ms = 2000

[tracking.noise]
measurement = 1.0
process_position = 1.0
process_velocity = 0.25

[health]
data_stale_ms = 10_000
stale_warn_ms = 5_000
panic_window_cycles = 20
max_panics_in_window = 3
cycle_budget_ms = 500
# Reporte cada 5s: la unidad de observación del escenario.
report_interval_s = 5

[output]
format = "jsonl"
save_dir = "workshop/runs/01-ingest-only"
rotate = "hourly"
snapshot_dir = "workshop/runs/01-ingest-only/snapshots"
snapshot_verbose = false
jsonl_level = "debug"

# ----------------------------------------------------------------------------
# Toda capa por encima de la ingesta, apagada.
# ----------------------------------------------------------------------------
[pipeline]
snapshot = false
infer = false
track = false
zones = false
fsm = false

# Apagado a propósito: el bridge de Rerun se homologa en el escenario 02. Con
# viz activa, su tráfico compite con la ingesta y contamina la línea base.
[viz]
enabled = false
rerun_addr = "192.168.1.20:9876"
