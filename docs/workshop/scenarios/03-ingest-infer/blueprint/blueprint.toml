# Blueprint del escenario 03: un solo modelo, sin cascada.
#
# Mismo contenido que el del escenario 01, pero no es el mismo objeto: en 01 el
# blueprint es un stub que sólo existe porque el bootstrap valida el catálogo
# aunque `pipeline.infer` esté apagado. Acá declara lo que efectivamente corre
# dentro del lazo, y es el que hay que tocar para cambiar qué se mide.
#
# Un solo modelo a propósito: con una cascada, el atraso medido sería la suma
# de varias etapas y no se podría atribuir.
#
# `requires_tracking = false` es esencial: con `true`, bootstrap rechaza
# `pipeline.track = false` (src/app/bootstrap/catalogs.rs:187).
[blueprint]
name = "ingest-infer"
description = "Ingesta e inferencia dentro del lazo, sin capas clínicas"
primary_model = "detect-fast"
models = ["detect-fast"]
requires_tracking = false

[[rules]]
model = "detect-fast"
