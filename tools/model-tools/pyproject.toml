[project]
name = "mana-model-tools"
version = "0.1.0"
description = "Export, optimize, validate, and promote ONNX models for mana-lite"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "onnx>=1.16",
    "onnxconverter-common>=1.14",
    "onnxslim>=0.1.82",
    "onnxruntime>=1.18",
    "opencv-python-headless>=4.10",
]

[project.optional-dependencies]
export = ["ultralytics>=8.3"]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
model-tools = "mana_model_tools.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mana_model_tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
