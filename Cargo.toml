[workspace]
members = ["std/mana-rtsp", "std/mana-types", "std/mana-video", "std/mana-viz", "std/mana-geometry"]

[package]
name = "mana-lite"
default-run = "mana-lite"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Clinical-grade real-time vision pipeline — single-binary PLC superloop"
license = "AGPL-3.0"
repository = "https://github.com/mana-os/mana-lite"
readme = "README.md"
keywords = ["clinical", "vision", "rtsp", "onnx", "pipeline"]
categories = ["command-line-utilities", "science"]
authors = ["Mana OS Contributors"]

[[bin]]
name = "mana-lite"
path = "src/main.rs"

[dependencies]
mana-rtsp = { path = "std/mana-rtsp" }
mana-video = { path = "std/mana-video" }
mana-viz = { path = "std/mana-viz" }
mana-types = { path = "std/mana-types" }
mana-geometry = { path = "std/mana-geometry", features = ["polygonize"] }
retina = "0.4"
tokio = { version = "1", features = ["macros", "rt", "net", "time", "signal"] }
futures = "0.3"
url = "2"
ultralytics-inference = { path = "../inference", default-features = false }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
chrono = "0.4"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
ffmpeg-next = "8"
image = "0.25"
imageproc = "0.25"
ndarray = "0.17"
vernier-mask = "0.2"
rerun = "0.35"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
panic = "abort"
strip = true

[profile.dev]
opt-level = 1

[lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"

[lints.rust]
unsafe_code = "warn"
