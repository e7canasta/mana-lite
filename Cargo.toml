[workspace]
members = [
    "core/mana-control",
    "core/mana-perception",
    "std/mana-id",
    "std/mana-rtsp",
    "std/mana-types",
    "std/mana-video",
    "std/mana-viz",
    "std/mana-geometry",
]

[package]
name = "mana-lite"
default-run = "mana-lite"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Clinical-grade real-time vision pipeline — single-binary PLC superloop"
license = "AGPL-3.0"
repository = "https://github.com/mana-os/mana-lite"
readme = "README.md"
keywords = ["clinical", "vision", "rtsp", "onnx", "pipeline"]
categories = ["command-line-utilities", "science"]
authors = ["Mana OS Contributors"]

[features]
default = ["ffmpeg", "rerun"]
ffmpeg = ["dep:ffmpeg-next", "mana-video/ffmpeg"]
rerun = ["dep:rerun", "dep:mana-viz", "mana-viz/rerun"]

[[bin]]
name = "mana-lite"
path = "src/main.rs"

[[bin]]
name = "depth-image-probe"
path = "src/bin/depth-image-probe.rs"
required-features = ["rerun"]

[dependencies]
mana-rtsp = { path = "std/mana-rtsp" }
mana-video = { path = "std/mana-video", default-features = false }
mana-viz = { path = "std/mana-viz", optional = true, default-features = false }
mana-types = { path = "std/mana-types" }
mana-geometry = { path = "std/mana-geometry", features = ["polygonize"] }
mana-id = { path = "std/mana-id" }
mana-control = { path = "core/mana-control" }
mana-perception = { path = "core/mana-perception" }
retina = "0.4"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "net", "time", "signal"] }
futures = "0.3"
url = "2"
ultralytics-inference = { path = "../inference", default-features = false }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
chrono = "0.4"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
ffmpeg-next = { version = "8", optional = true }
image = "0.25"
imageproc = "0.25"
ndarray = "0.17"
vernier-mask = "0.2"
rerun = { version = "0.35", optional = true }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
panic = "abort"
strip = true

[profile.dev]
opt-level = 1

[lints]
workspace = true

# Shared by every member crate (each opts in with `[lints] workspace = true`).
# Previously this table lived under `[package]`, so it governed only the
# binary — the tier crates that hold the determinism-critical logic were the
# ones escaping it.
[workspace.lints.clippy]
# priority = -1 so the specific `allow`s below win over the group `warn`s;
# without it Cargo applies them in an unspecified order and the group wins.
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# Stylistic families, silenced so the remaining warnings stay actionable.
# A warning set nobody can act on is a warning set everybody ignores.
must_use_candidate = "allow"
missing_const_for_fn = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
doc_markdown = "allow"
similar_names = "allow"
unreadable_literal = "allow"
suboptimal_flops = "allow"
redundant_closure_for_method_calls = "allow"

# Deliberately NOT silenced: the numeric-cast family and float comparison.
# This is a vision/control pipeline — truncation, precision loss and exact
# float equality are where its bugs live, not in missing backticks.

[workspace.lints.rust]
unsafe_code = "warn"
