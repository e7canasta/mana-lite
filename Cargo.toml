[workspace]
members = ["std/mana-rtsp"]

[package]
name = "mana-lite"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Clinical-grade real-time vision pipeline — single-binary PLC superloop"
license = "AGPL-3.0"
repository = "https://github.com/mana-os/mana-lite"
readme = "README.md"
keywords = ["clinical", "vision", "rtsp", "onnx", "pipeline"]
categories = ["command-line-utilities", "science"]
authors = ["Mana OS Contributors"]

[[bin]]
name = "mana-lite"
path = "src/main.rs"

[dependencies]
mana-rtsp = { path = "std/mana-rtsp" }
retina = "0.4"
tokio = { version = "1", features = ["macros", "rt", "net", "time"] }
futures = "0.3"
url = "2"
ort = { version = "2.0.0-rc.12", features = ["download-binaries"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
chrono = "0.4"
thiserror = "2"
log = "0.4"
env_logger = "0.11"

[dependencies.ffmpeg-next]
version = "7"
optional = true

[dependencies.image]
version = "0.25"
optional = true

[features]
default = []
video = ["ffmpeg-next", "image"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
panic = "abort"
strip = true

[profile.dev]
opt-level = 1

[lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"

[lints.rust]
unsafe_code = "warn"
