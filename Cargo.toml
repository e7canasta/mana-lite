[package]
name = "mana-lite"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Clinical-grade real-time vision pipeline lite — single-binary superloop"
license = "AGPL-3.0"
repository = "https://github.com/mana/mana-lite"

[[bin]]
name = "mana-lite"
path = "src/main.rs"

[dependencies]
retina = "0.4"
tokio = { version = "1", features = ["macros", "rt", "net", "time"] }
ort = { version = "2.0.0-rc.12", features = ["download-binaries"] }
ffmpeg-next = "7"
image = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"
log = "0.4"
env_logger = "0.11"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
panic = "abort"
strip = true

[profile.dev]
opt-level = 1

[lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"

[lints.rust]
unsafe_code = "warn"
