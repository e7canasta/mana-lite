[[fsm.transitions]]
from = "exiting"
to = "other"
dwell = "500ms"
guards = [
    { type = "cardinality", value = "single" },
    { type = "person_present" },
    { type = "face_absent" },
]

[[fsm.transitions]]
from = "exiting"
to = "idle"
dwell = "1500ms"
guards = [{ type = "person_absent" }]
