# Lightweight deployment: one primary detector plus segmentation enrichment.
# The presence filter holds short detector dropouts before the tracker.
[blueprint]
name = "detect-seg"
description = "Detect one person and run segmentation on the confirmed track"
primary_model = "detect-fast"
models = ["detect-fast", "seg-standard"]
requires_tracking = true

[[rules]]
model = "detect-fast"

[[rules]]
model = "seg-standard"
requires = "detect-fast"
requires_class = "person"
requires_exact_count = 1
requires_min_confidence = 0.50
# Use the confirmed person track to resolve the dynamic segmentation crop so
# short detector dropouts do not suppress the segmentation child.
same_frame = false
