# Lightweight deployment: one primary detector plus face and pose enrichment.
# The presence filter holds short detector dropouts before the tracker.
[blueprint]
name = "detect-face-pose"
description = "Detect one person and run face and pose on the confirmed track"
primary_model = "detect-fast"
models = ["detect-fast", "face-yolo", "pose-standard"]
requires_tracking = true

[[rules]]
model = "detect-fast"

[[rules]]
model = "face-yolo"
requires = "detect-fast"
requires_class = "person"
requires_exact_count = 1
requires_min_confidence = 0.50
# Use the confirmed person track to resolve the dynamic face crop so short
# detector dropouts do not suppress the face child.
same_frame = false

[[rules]]
model = "pose-standard"
requires = "detect-fast"
requires_class = "person"
requires_exact_count = 1
requires_min_confidence = 0.50
# Use the confirmed person track to resolve the dynamic pose crop so short
# detector dropouts do not suppress the pose child.
same_frame = false
