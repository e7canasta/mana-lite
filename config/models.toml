[models.detect-fast]
path = "models/yolo26n.onnx"
task = "detect"
confidence = 0.5
imgsz = 640
# Optional: static ROI — only look at part of the frame
# [models.detect-fast.crop]
# type = "static"
# region = [100, 50, 500, 400]

[models.detect-large]
path = "models/yolo26x.onnx"
task = "detect"
confidence = 0.3
imgsz = 640

[models.detect-v2]
path = "models/yolo26s.onnx"
task = "detect"
confidence = 0.3
imgsz = 640

[models.pose-standard]
path = "models/yolo26n-pose.onnx"
task = "pose"
confidence = 0.3
imgsz = 640
# Optional: dynamic ROI — crop to largest "person" bbox from parent model
# [models.pose-standard.crop]
# type = "largest_class"
# class = "person"
# margin = 0.15
#
# Optional: minimum region to always include (union with dynamic crop)
# Useful for: bed model that should never look at less than the bed area,
#   even when a person walks across a corner of it.
# [models.bed-detector.crop]
# type = "largest_class"
# class = "person"
# margin = 0.15
# min_region = [100, 200, 500, 450]  # bed area — always covered

