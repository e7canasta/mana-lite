[models.detect-fast]
enabled = true
# Baseline small FP16 320: models/yolo26s-fp16-320.onnx
path = "models/yolo26x-fp16-640.onnx"
task = "detect"
confidence = 0.20
iou = 0.5
imgsz = 640
half = true

[models.detect-fast.postprocess]
allow_classes = ["person", "wheelchair"]
min_confidence = 0.25
min_area_ratio = 0.001
max_area_ratio = 1.0
nms_iou = 0.50

[models.detect-fast.crop]
type = "static"
# Baseline centered ROI 680x680: [560, 140, 1240, 820]
region = [560, 140, 1240, 820]
# region = [420, 0, 1500, 1080]

