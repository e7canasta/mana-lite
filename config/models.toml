[models.detect-fast]
enabled = true
# Baseline small FP16 320: models/yolo26s-fp16-320.onnx
path = "models/yolo26x-fp16-640.onnx"
task = "detect"
confidence = 0.20
iou = 0.5
imgsz = 640
half = true

[models.detect-fast.postprocess]
allow_classes = ["person", "wheelchair"]
min_confidence = 0.25
min_area_ratio = 0.001
max_area_ratio = 1.0
nms_iou = 0.50

[models.detect-fast.crop]
type = "static"
# Baseline centered ROI 680x680: [560, 140, 1240, 820]
region = [560, 140, 1240, 820]
# region = [420, 0, 1500, 1080]

# [models.detect-large]
# path = "models/yolo26x.onnx"
# task = "detect"
# confidence = 0.3
# imgsz = 640

# [models.detect-v2]
# path = "models/yolo26s.onnx"
# task = "detect"
# confidence = 0.3
# imgsz = 640

[models.pose-standard]
enabled = false
# Baseline FP32 640: models/yolo26n-pose.onnx
path = "tools/model-tools/artifacts/yolo26-fp16/yolo26s-pose-fp16-320.onnx"
task = "pose"
confidence = 0.3
iou = 0.5
imgsz = 320
half = true

[models.pose-standard.crop]
type = "largest_class"
class = "person"
margin = 0.15

[models.pose-standard.postprocess]
allow_classes = ["person"]
min_confidence = 0.1
min_area_ratio = 0.01
max_area_ratio = 1.0
nms_iou = 0.50

[models.face-yolo]
enabled = true
path = "models/yolov12l-face.onnx"
task = "detect"
confidence = 0.10
iou = 0.5
imgsz = 640

[models.face-yolo.crop]
type = "largest_class"
class = "person"
# The face model receives a square upper-body crop, not the full person bbox.
square_size = 320
upper_fraction = 0.50

[models.face-yolo.postprocess]
allow_classes = ["face"]
min_confidence = 0.10
min_area_ratio = 0.0001
max_area_ratio = 0.35
# Face duplicates from the same subject should collapse aggressively.
# The explicit NMS keeps the highest-confidence box.
nms_iou = 0.05
# Optional second stage after NMS: keep only the strongest candidate.
max_detections = 1

[models.seg-standard]
enabled = false
# Baseline small FP16 320: models/yolo26s-seg-fp16-320.onnx
path = "models/yolo26x-seg-fp16-640.onnx"
task = "detect"
confidence = 0.20
imgsz = 640
half = true
iou = 0.1
polygon_simplify = 0.98

[models.seg-standard.crop]
type = "largest_class"
class = "person"
margin = 0.15

[models.seg-standard.postprocess]
allow_classes = ["person"]
min_confidence = 0.25
min_area_ratio = 0.05
max_area_ratio = 1.0
min_component_area_ratio = 0.05
mask_threshold = 0.5
nms_iou = 0.10

[models.depth-standard]
# Benchmark 2026-08-07: l/320 (172ms) recomendado — x/320 era un outlier
# estructural; m/640 (492ms) es la opcion de calidad si el presupuesto permite.
enabled = false
path = "models/yolo26l-depth-fp16-320.onnx"
task = "depth"
confidence = 0.0
imgsz = 320
half = true

[models.depth-standard.crop]
type = "static"
region = [560, 140, 1240, 820]

# ── YOLO26 FP16 benchmark matrix ───────────────────────────
# 4 tareas × 4 tamaños × 2 resoluciones. Estas entradas permanecen deshabilitadas
# para que el runtime no cargue toda la matriz; para probar una variante hay que
# habilitarla y apuntar la rama correspondiente del cascade a su clave.

