[fsm]
initial = "idle"

[fsm.states.idle]
label = "Room Empty"
models = ["detect-fast"]

[fsm.states.watching]
label = "Person Present"
models = ["detect-fast", "pose-standard"]

[fsm.states.bed_approaching]
label = "APPROACH: Bed Region Close"
models = ["detect-fast", "pose-standard"]

[fsm.states.bed_alert]
label = "ALERT: Bed Exit Attempt"
models = ["detect-fast", "pose-standard"]
dwell_min_ms = 3_000

[fsm.states.blind]
label = "BLIND: No Camera Signal"

# ── Wildcard → blind on data stale ──

[[fsm.transitions]]
from = "*"
to = "blind"
guards = [{ type = "data_stale" }]

# ── Idle ↔ Watching ──

[[fsm.transitions]]
from = "idle"
to = "watching"
guards = [
    { type = "zone_occupied", zone = "bed", min_confidence = 0.5 },
    { type = "zone_occupied", zone = "chair", min_confidence = 0.5 }
]

[[fsm.transitions]]
from = "watching"
to = "idle"
guards = [{ type = "all_zones_vacant", min_duration_ms = 60_000 }]

# ── Watching → Bed Alert ──

[[fsm.transitions]]
from = "watching"
to = "bed_alert"
guards = [{ type = "zone_vacated", zone = "bed", min_duration_ms = 3_000 }]

# Watching -> Bed approaching: combines person identity/zone occupancy with
# the calibrated depth rule. The depth threshold remains provisional until a
# physical scene reference is measured (config/depth-rules.toml).

[[fsm.transitions]]
from = "watching"
to = "bed_approaching"
guards = [
    { type = "zone_occupied", zone = "bed", min_confidence = 0.5 },
    { type = "depth_rule", rule = "bed-approach" }
]

[[fsm.transitions]]
from = "bed_approaching"
to = "watching"
guards = [
    { type = "depth_rule", rule = "bed-approach", triggered = false }
]

# ── Bed Alert → Watching (recovery) ──

[[fsm.transitions]]
from = "bed_alert"
to = "watching"
guards = [
    { type = "zone_occupied", zone = "bed", min_duration_ms = 5_000 }
]

# ── Bed Alert dwell timeout ──

[[fsm.transitions]]
from = "bed_alert"
to = "blind"
dwell = "5m"

# ── blind → idle cuando vuelve la senal ──
# A idle, no al estado anterior: tras la ceguera no sabes que paso en la
# habitacion, asi que se reconstruye desde cero (y se limpia el latch).

[[fsm.transitions]]
from = "blind"
to = "idle"
guards = [{ type = "data_fresh" }]
