# Reglas funcionales de profundidad (spec depth-standard §9).
#
# Una regla consulta una region global contra el mapa local del ROI y compara
# una metrica robusta con un umbral de distancia en metros. Emite evidencia
# numerica (evento `depth_region`); NO gatea ningun otro modelo.
#
# ATENCION: los umbrales siguientes son PROVISIONALES y sin calibrar.
# Calibrar por camara y escena antes de usar una regla en produccion (spec
# §15). Una calibracion de un punto usa:
# calibration = { reference_model_m = 2.0, reference_scene_m = 1.0 }
# y escala value = model * (reference_scene_m / reference_model_m). La
# referencia debe medirse fisicamente; sin ella no afirmar distancia metrica.

[[rules]]
name = "bed-approach"
region = [452, 140, 1300, 1029]
metric = "median"
op = "lt"
threshold_m = 1.5
min_valid_ratio = 0.5
# Descomentar despues de medir una referencia fisica en esta escena:
# calibration = { reference_model_m = 2.0, reference_scene_m = 1.0 }
