task = "pose"

[defaults]
confidence = 0.30
iou = 0.50
half = true

[profiles.person]

[profiles.person.postprocess]
allow_classes = ["person"]
min_confidence = 0.10
min_area_ratio = 0.01
max_area_ratio = 1.0
nms_iou = 0.50

[profiles.person.crop]
type = "largest_class"
class = "person"
margin = 0.15

[models.pose-standard]
profile = "person"
enabled = true
path = "tools/model-tools/artifacts/yolo26-fp16/yolo26s-pose-fp16-320.onnx"
