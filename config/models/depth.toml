task = "depth"

[defaults]
confidence = 0.0
iou = 0.50
half = true

# A person crop keeps more body pixels at the same model input size. It is an
# opt-in child branch; the scene depth root remains the bed/context reference.
[profiles.person.crop]
type = "largest_class"
class = "person"
margin = 0.20

[models.depth-standard]
enabled = false
path = "models/yolo26l-depth-fp16-320.onnx"
imgsz = 320

[models.depth-standard.crop]
# Fixed depth context ROI for bed-approach/dwell rules, independent of the
# dynamic face detection crop.
type = "static"
region = [560, 140, 1240, 820]

[models.depth-s-320]
enabled = false
path = "tools/model-tools/artifacts/yolo26-fp16/yolo26s-depth-fp16-320.onnx"
imgsz = 320

[models.depth-person-s-320]
enabled = false
profile = "person"
path = "tools/model-tools/artifacts/yolo26-fp16/yolo26s-depth-fp16-320.onnx"
imgsz = 320

[models.depth-person-s-192]
enabled = false
profile = "person"
path = "tools/model-tools/artifacts/yolo26-fp16/yolo26s-depth-fp16-192.onnx"
imgsz = 192

[models.depth-s-640]
enabled = false
path = "tools/model-tools/artifacts/yolo26-fp16/yolo26s-depth-fp16-640.onnx"
imgsz = 640

