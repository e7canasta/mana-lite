task = "segment"

[defaults]
confidence = 0.20
iou = 0.10
half = true

[profiles.person-seg.postprocess]
allow_classes = ["person"]
min_confidence = 0.25
min_area_ratio = 0.05
max_area_ratio = 1.0
min_component_area_ratio = 0.05
mask_threshold = 0.5
nms_iou = 0.10

[profiles.person-seg.crop]
type = "largest_class"
class = "person"
margin = 0.15

[models.seg-standard]
profile = "person-seg"
enabled = true
path = "tools/model-tools/artifacts/yolo26-fp16/yolo26s-seg-fp16-320.onnx"
imgsz = 320
half = true
polygon_simplify = 0.98

