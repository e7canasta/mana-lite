schema_version = 1
posture_id = "sentado-1"
label = "sentado"
training_sample = "sentado-1"
base_posture = "sentado-in-bed"
plane = "in-bed"

[policy]
min_observed_features = 3
min_observed_components = 2
allow_partial = true

