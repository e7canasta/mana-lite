center = 1.0
tolerance = 1.0
weight = 1.0

[[features]]
id = "surface.hips_bed_support"
source = "surface"
field = "hips_bed_support"
center = 1.0
tolerance = 1.0
weight = 0.8

[[features]]
id = "surface.head_zone_index"
source = "surface"
field = "head_zone_index"
center = 0.25
tolerance = 0.6
weight = 0.35

[[features]]
id = "surface.torso_zone_index"
source = "surface"
field = "torso_zone_index"
center = 0.25
tolerance = 0.6
weight = 0.35

[[features]]
