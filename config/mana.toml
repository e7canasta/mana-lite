metrics_file = "config/metrics.toml"
viz_file = "config/viz.toml"
rerun_file = "config/rerun.toml"

# ============================================================================
# MECANISMO DE DESPLIEGUE
# Ajustes de cámara, transporte, modelos y dispositivo. Estos valores cambian
# al cambiar el hardware o el perfil de ejecución, no el protocolo clínico.
# ============================================================================
[source]
#url = "rtsp://192.168.1.6:8554/mana015"
#url = "rtsp://192.168.1.15:8554/clip1"
url = "rtsp://192.168.1.6:8554/home2"
username = "admin"
password = ""
transport = "tcp"
keyframes_only = true

[ingest]
poll_timeout_ms = 50
error_window_size = 128
error_window_threshold = 25
reconnect_backoff_initial_ms = 1000
reconnect_backoff_max_ms = 30000

[inference]
model_catalog = "config/models.toml"
# Select one named inference profile under config/blueprints/.
# Calibration profile: timed raw cardinality plus face ROI without tracking.
blueprint_file = "config/blueprints/detect-room-face/blueprint.toml"
# Use this profile when face inference itself must be excluded from the test.
# blueprint_file = "config/blueprints/detect-room-raw/blueprint.toml"
depth_rules_file = "config/depth-rules.toml"
zones_file = "config/zones.toml"
fsm_file = "config/blueprints/detect-room-face/fsm.toml"

[detection]
# Mecanismo de asociación y consolidación entre salidas de modelos.
face_component_coverage = 0.70
face_max_center_y_ratio = 0.65
face_edge_margin_px = 32
same_class_iou = 0.5

# ============================================================================
# POLÍTICA DE FUSIÓN DE EVIDENCIAS
# Estos valores calibran el significado de apoyo, contradicción y geometría
# derivada. El código implementa las operaciones; el perfil decide sus pesos.
# ============================================================================
[face_pose]
enabled = true
pose_model_key = "pose-standard"
uncertain_face_max_confidence = 0.60
min_face_confidence = 0.10
pose_request_priority = 200
request_ttl_ms = 4000
keypoint_min_confidence = 0.50
min_head_joints = 3
min_face_person_coverage = 0.70
min_pose_person_iou = 0.20
max_head_face_center_distance_ratio = 0.75
quality_face_weight = 0.25
quality_pose_weight = 0.20
quality_joint_weight = 0.30
quality_geometry_weight = 0.25

[perception.validation]
relation_support_threshold = 0.50
source_quality_weight = 0.40
agreement_quality_weight = 0.60

[perception.body_parts]
frame_local_match_iou = 0.50
face_frame_local_coverage = 0.50
joint_min_confidence = 0.25
segment_radius_ratio = 0.035
head_padding_ratio = 0.06
torso_radius_multiplier = 1.5
head_face_weight = 0.65
head_pose_weight = 0.35
mask_quality_weight = 0.25
cross_model_quality_weight = 0.20
minimum_geometry_extent_px = 1.0
geometry_epsilon = 0.00001

# ============================================================================
# POLÍTICA CLÍNICA
# Estos tiempos expresan intención del protocolo y son agnósticos de cámara.
# No multiplicarlos para compensar una frecuencia de I-frame distinta.
# Los `dwell_min_ms` y `dwell` clínicos viven en los catálogos de `fsm.toml`.
# ============================================================================
[presence]
enabled = true
class = "person"

[presence.poi]
# PLC TON: real ms of valid one-person detection required before room becomes single.
on_ms = 200
# PLC TOF for the POI/tracker path; room exit uses occupancy.empty_confirm_ms.
off_ms = 16_000

[presence.occupancy]
# Room transitions use monotonic time, not keyframe/inference counts.
single_confirm_ms = 3000
empty_confirm_ms = 8000
multiple_confirm_ms = 5000
multiple_exit_ms = 5000
require_confirmed_tracks = false

[tracking]
# Política clínica: tolerancia de oclusión y vigencia de una detección vieja.
max_age_ms = 40_000
tentative_max_age_ms = 6_000
ghost_max_ms = 6_000

# Mecanismo: asociación y periodo nominal del dispositivo.
min_hits = 2
iou_threshold = 0.2
nominal_dt_ms = 2000

[tracking.noise]
measurement = 1.0
process_position = 1.0
process_velocity = 0.25

[health]
# Política clínica: umbrales de ausencia de señal.
data_stale_ms = 10_000
stale_warn_ms = 5_000

# Mecanismo: watchdog y presupuesto de ejecución del dispositivo.
panic_window_cycles = 20
max_panics_in_window = 3
cycle_budget_ms = 500
report_interval_s = 5

# ============================================================================
# MECANISMO DE DESPLIEGUE
# Salida, pipeline y visualización.
# ============================================================================
[output]
format = "jsonl"
save_dir = "./logs"
rotate = "hourly"
snapshot_dir = "./snapshots"
snapshot_verbose = false
jsonl_level = "debug"

[pipeline]
snapshot = false
infer = true
track = true
zones = true
fsm = true
[viz]
enabled = true
rerun_addr = "192.168.1.20:9876"
