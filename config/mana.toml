[source]
url = "rtsp://192.168.1.10:8554/clip1"
username = "admin"
password = ""
transport = "tcp"
keyframes_only = true

[inference]
model_catalog = "config/models.toml"
default_model = "detect-fast"
zones_file = "config/zones.toml"
fsm_file = "config/fsm.toml"

[health]
data_stale_ms = 10_000
max_consecutive_panics = 3
report_interval_s = 5

[output]
format = "jsonl"
save_dir = "./logs"
rotate = "hourly"
