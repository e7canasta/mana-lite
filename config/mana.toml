metrics_file = "config/metrics.toml"
viz_file = "config/viz.toml"
rerun_file = "config/rerun.toml"

[source]
#url = "rtsp://192.168.1.6:8554/mana015"
#url = "rtsp://192.168.1.15:8554/clip1"
url = "rtsp://192.168.1.6:8554/home"
username = "admin"
password = ""
transport = "tcp"
keyframes_only = true

[ingest]
poll_timeout_ms = 50
error_window_size = 128
error_window_threshold = 25
reconnect_backoff_initial_ms = 1000
reconnect_backoff_max_ms = 30000

[inference]
model_catalog = "config/models.toml"
# Select one named inference profile under config/blueprints/.
# Calibration profile: timed raw cardinality plus face ROI without tracking.
blueprint_file = "config/blueprints/detect-room-face/blueprint.toml"
# Use this profile when face inference itself must be excluded from the test.
# blueprint_file = "config/blueprints/detect-room-raw/blueprint.toml"
depth_rules_file = "config/depth-rules.toml"
zones_file = "config/zones.toml"
fsm_file = "config/blueprints/detect-room-face/fsm.toml"

[detection]
face_component_coverage = 0.70
face_max_center_y_ratio = 0.65
face_edge_margin_px = 32

[presence]
enabled = true
class = "person"

[presence.poi]
# PLC TON: valid one-person detections required before room becomes single.
on_ticks = 1
# PLC TOF for the POI/tracker path; room exit uses occupancy.empty_confirm_ms.
off_ticks = 8

[presence.occupancy]
# Room transitions use monotonic time, not keyframe/inference counts.
single_confirm_ms = 3000
empty_confirm_ms = 8000
multiple_confirm_ms = 5000
multiple_exit_ms = 5000
require_confirmed_tracks = false

[tracking]
min_hits = 2
max_age_ms = 4000
tentative_max_age_ms = 600
iou_threshold = 0.2

[health]
data_stale_ms = 10_000
max_consecutive_panics = 3
report_interval_s = 5

[output]
format = "jsonl"
save_dir = "./logs"
rotate = "hourly"
snapshot_dir = "./snapshots"
snapshot_verbose = false
jsonl_level = "debug"

[pipeline]
snapshot = false
infer = true
track = true
zones = true
fsm = true
[viz]
enabled = true
rerun_addr = "192.168.1.18:9876"
