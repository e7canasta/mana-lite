metrics_file = "config/metrics.toml"
viz_file = "config/viz.toml"
rerun_file = "config/rerun.toml"

[source]
# url = "rtsp://192.168.1.6:8554/mana015"
url = "rtsp://192.168.1.14:8554/clip1"
# url = "rtsp://192.168.1.6:8554/home"
username = "admin"
password = ""
transport = "tcp"
keyframes_only = true

[ingest]
poll_timeout_ms = 50
error_window_size = 128
error_window_threshold = 25
reconnect_backoff_initial_ms = 1000
reconnect_backoff_max_ms = 30000

[inference]
model_catalog = "config/models.toml"
default_model = "detect-fast"
cascade_file = "config/cascade.toml"
# zones_file = "config/zones.toml"
# fsm_file = "config/fsm.toml"

[detection]
face_component_coverage = 0.70
face_max_center_y_ratio = 0.65

[tracking]
min_hits = 2
max_age = 20
tentative_max_age = 3
iou_threshold = 0.2

[health]
data_stale_ms = 10_000
max_consecutive_panics = 3
report_interval_s = 5

[output]
format = "jsonl"
save_dir = "./logs"
rotate = "hourly"
snapshot_dir = "./snapshots"
snapshot_verbose = false
jsonl_level = "debug"

[pipeline]
snapshot = false
infer = true
track = false
zones = false
fsm = false
[viz]
enabled = true
rerun_addr = "127.0.0.1:9876"
