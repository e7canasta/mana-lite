# Fallback cascade used only when no blueprint file is configured. All
# deployments use a blueprint, so this file is dormant; keep it aligned with
# the blueprint pattern (see config/blueprints/detect-face-pose-seg) so a
# no-blueprint run does not silently apply different gates.
[[rules]]
model = "detect-fast"

[[rules]]
model = "pose-standard"
requires = "detect-fast"
requires_class = "person"
requires_exact_count = 1
requires_min_confidence = 0.50
same_frame = false

[[rules]]
model = "face-yolo"
requires = "detect-fast"
requires_class = "person"
requires_exact_count = 1
requires_min_confidence = 0.50
same_frame = false

[[rules]]
model = "depth-standard"

[[rules]]
model = "seg-standard"
requires = "detect-fast"
requires_class = "person"
requires_exact_count = 1
requires_min_confidence = 0.50
same_frame = false
