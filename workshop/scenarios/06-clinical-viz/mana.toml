# ============================================================================
# ESCENARIO 06 — LA PILA CLÍNICA, CON OJOS
#
# El 05 con el visor encendido. No agrega ninguna capa de procesamiento: es el
# mismo blueprint, los mismos catálogos y los mismos umbrales. Lo que agrega es
# la posibilidad de **mirar** lo que el sistema decidió.
#
# Existe porque los peldaños de abajo prueban que el sistema sostiene su
# contrato temporal, y ninguno prueba que lo que ve sea razonable. Eso no lo
# prueba un número: lo prueba un par de ojos sobre los recortes, las cajas y la
# línea de tiempo de estados.
#
# **Sus números de cadencia no son la referencia.** La referencia es el 05, que
# corre sin visor a propósito. Acá el bridge compite con la ingesta, y cuánto
# cuesta es justamente uno de los dos números que este escenario produce.
#
#   timeout 180 cargo run --release -- --config workshop/scenarios/06-clinical-viz/mana.toml
#
# Necesita un visor de Rerun escuchando en `viz.rerun_addr`:
#
#   rerun --port 9876
# ============================================================================

# Este escenario se trae su propio archivo de observabilidad. La razón está
# adentro: los eventos clínicos que el mecanismo trae apagados.
metrics_file = "workshop/scenarios/06-clinical-viz/metrics.toml"
viz_file = "config/viz.toml"
rerun_file = "config/rerun.toml"

# Idéntico al resto de la escalera: el transporte es el control del
# experimento. Para revisar con contenido clínico, apuntar a una fuente con
# una persona en escena y dejar todo lo demás igual.
[source]
url = "rtsp://192.168.1.6:8554/home2"
username = "admin"
password = ""
transport = "tcp"
keyframes_only = true

[ingest]
poll_timeout_ms = 50
error_window_size = 128
error_window_threshold = 25
reconnect_backoff_initial_ms = 1000
reconnect_backoff_max_ms = 30000

[inference]
model_catalog = "config/models.toml"
blueprint_file = "config/blueprints/detect-room-face/blueprint.toml"
zones_file = "config/zones.toml"
fsm_file = "config/blueprints/detect-room-face/fsm.toml"
depth_rules_file = "config/depth-rules.toml"

[detection]
face_component_coverage = 0.70
face_max_center_y_ratio = 0.65
face_edge_margin_px = 32
same_class_iou = 0.5

# Los tiempos de producción, igual que en el 05. Un escenario de revisión que
# afloja los umbrales muestra un sistema que no es el que se despliega.
[presence]
enabled = true
class = "person"

[presence.poi]
on_ms = 200
off_ms = 16_000

[presence.occupancy]
single_confirm_ms = 3000
empty_confirm_ms = 8000
multiple_confirm_ms = 5000
multiple_exit_ms = 5000
require_confirmed_tracks = false

[tracking]
max_age_ms = 40_000
tentative_max_age_ms = 6_000
ghost_max_ms = 6_000
min_hits = 2
iou_threshold = 0.2
nominal_dt_ms = 2000

[tracking.noise]
measurement = 1.0
process_position = 1.0
process_velocity = 0.25

[health]
data_stale_ms = 10_000
stale_warn_ms = 5_000
panic_window_cycles = 20
max_panics_in_window = 3
cycle_budget_ms = 500
report_interval_s = 5

[output]
format = "jsonl"
save_dir = "workshop/runs/06-clinical-viz"
rotate = "hourly"
snapshot_dir = "workshop/runs/06-clinical-viz/snapshots"
snapshot_verbose = false
jsonl_level = "debug"

# Todo encendido, igual que el 05.
[pipeline]
snapshot = false
infer = true
track = true
zones = true
fsm = true

# ----------------------------------------------------------------------------
# La única diferencia con el 05.
#
# `jpeg`, no `raw`: el escenario 02 midió que raw satura el enlace y produce
# `viz_pisados`. Ese peldaño ya tomó esta decisión y acá se aplica en vez de
# volver a discutirla.
# ----------------------------------------------------------------------------
[viz]
enabled = true
rerun_addr = "192.168.1.20:9876"
image_format = "jpeg"
image_quality = 75
