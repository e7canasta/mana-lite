# ============================================================================
# ESCENARIO 05 — LA PILA CLÍNICA COMPLETA
#
# El último peldaño: zonas, FSM y presencia encendidos sobre el blueprint que
# efectivamente se despliega (`detect-room-face`). Es el único escenario donde
# el sistema toma decisiones clínicas.
#
# Lo que prueba no es que detecte bien —eso lo prueban los peldaños de abajo—
# sino que **la pila completa no le cuesta cadencia al lazo**. Si el atraso se
# mantiene en el piso del temporizador con todo prendido, el aislamiento del
# lazo se sostiene de punta a punta y no sólo con inferencia.
#
# Es también el primer escenario donde la línea `evid:` significa algo: hay un
# FSM decidiendo sobre esa evidencia, con temporizadores clínicos corriendo.
#
#   cargo run --release -- --config workshop/scenarios/05-clinical/mana.toml
# ============================================================================

# Archivos de mecanismo del dispositivo, compartidos con producción. No
# expresan política del escenario, así que no se duplican.
metrics_file = "config/metrics.toml"
viz_file = "config/viz.toml"
rerun_file = "config/rerun.toml"

[perception.validation]
relation_support_threshold = 0.50
source_quality_weight = 0.40
agreement_quality_weight = 0.60

[perception.body_parts]
frame_local_match_iou = 0.50
face_frame_local_coverage = 0.50
joint_min_confidence = 0.25
segment_radius_ratio = 0.035
head_padding_ratio = 0.06
torso_radius_multiplier = 1.5
head_face_weight = 0.65
head_pose_weight = 0.35
mask_quality_weight = 0.25
cross_model_quality_weight = 0.20
minimum_geometry_extent_px = 1.0
geometry_epsilon = 0.00001

# Idénticos al escenario 01: es el control del experimento y la comparación no
# vale si el transporte cambia.
[source]
url = "rtsp://192.168.1.6:8554/home2"
username = "admin"
password = ""
transport = "tcp"
keyframes_only = true

[ingest]
poll_timeout_ms = 50
error_window_size = 128
error_window_threshold = 25
reconnect_backoff_initial_ms = 1000
reconnect_backoff_max_ms = 30000

[inference]
model_catalog = "config/models.toml"
blueprint_file = "config/blueprints/detect-room-face/blueprint.toml"
# Los catálogos clínicos, que en los peldaños anteriores se omitían. Son los
# mismos archivos que usa producción: si acá compilan y gobiernan, gobiernan
# allá.
zones_file = "config/zones.toml"
fsm_file = "config/blueprints/detect-room-face/fsm.toml"
depth_rules_file = "config/depth-rules.toml"

[detection]
face_component_coverage = 0.70
face_max_center_y_ratio = 0.65
face_edge_margin_px = 32
same_class_iou = 0.5

# ----------------------------------------------------------------------------
# Política clínica activa. Los tiempos son los de producción a propósito: un
# escenario que afloja los umbrales para pasar no prueba nada.
# ----------------------------------------------------------------------------
[presence]
enabled = true
class = "person"

[presence.poi]
on_ms = 200
off_ms = 16_000

[presence.occupancy]
single_confirm_ms = 3000
empty_confirm_ms = 8000
multiple_confirm_ms = 5000
multiple_exit_ms = 5000
require_confirmed_tracks = false

[tracking]
max_age_ms = 40_000
tentative_max_age_ms = 6_000
ghost_max_ms = 6_000
min_hits = 2
iou_threshold = 0.2
nominal_dt_ms = 2000

[tracking.noise]
measurement = 1.0
process_position = 1.0
process_velocity = 0.25

[health]
data_stale_ms = 10_000
stale_warn_ms = 5_000
panic_window_cycles = 20
max_panics_in_window = 3
# 500ms, igual que en 01. No se afloja para este escenario a propósito: el
# presupuesto mide el **periodo**, y el periodo no debería moverse aunque la
# inferencia bloquee el lazo — la recuperación en ráfaga lo compensa. Si acá
# aparecieran overruns, el bloqueo excede un periodo entero y eso es un
# hallazgo, no un umbral mal puesto.
cycle_budget_ms = 500
report_interval_s = 5

[output]
format = "jsonl"
save_dir = "workshop/runs/05-clinical"
rotate = "hourly"
snapshot_dir = "workshop/runs/05-clinical/snapshots"
snapshot_verbose = false
jsonl_level = "debug"

# ----------------------------------------------------------------------------
# Todo encendido. No queda ninguna capa por agregar.
# ----------------------------------------------------------------------------
[pipeline]
snapshot = false
infer = true
track = true
zones = true
fsm = true

# Apagado: el tráfico del bridge compite con la ingesta (medido en la Fase 0,
# ARCHITECTURE.md §3.1) y contaminaría la medición de atraso.
[viz]
enabled = false
rerun_addr = "192.168.1.20:9876"
